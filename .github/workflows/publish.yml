name: Publish

# Manual only. A tag push or merge should never be able to publish by itself:
# npm forbids reusing a version even after an unpublish, so an accidental run
# permanently burns a version number.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest
      target:
        description: Packages to publish
        required: true
        default: cli
        type: choice
        options:
          - cli
          - all
      dry_run:
        description: Pack and verify without publishing
        type: boolean
        default: true
      verify_only:
        description: Skip upload and verify the existing CLI from npm
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for provenance.

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Select packages
        run: |
          case "${{ inputs.target }}" in
            cli)
              packages="packages/contracts packages/cli"
              ;;
            all)
              packages="packages/contracts packages/cli packages/server sdks/react-native sdks/web"
              ;;
            *)
              echo "::error::Unknown publish target: ${{ inputs.target }}"
              exit 1
              ;;
          esac
          echo "NOTIFIE_PACKAGES=$packages" >> "$GITHUB_ENV"
          echo "Selected: $packages"

      # A prerelease published under "latest" becomes what every plain
      # `npm install` resolves to. npm rejects an untagged prerelease, but it
      # will happily honour an explicit --tag latest, so the check is here.
      - name: Refuse a prerelease under the latest tag
        if: ${{ inputs.tag == 'latest' }}
        run: |
          set -euo pipefail
          for pkg in $NOTIFIE_PACKAGES; do
            version="$(node -p "require('./$pkg/package.json').version")"
            case "$version" in
              *-*)
                echo "::error::$pkg is a prerelease ($version) and cannot be published as latest"
                exit 1
                ;;
            esac
          done
          echo "All packages are stable releases."

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p staging
          # pnpm, not npm: @notifie-dev/cli and @notifie-dev/server depend on
          # @notifie-dev/contracts through the workspace: protocol, and only pnpm
          # resolves that to a real version when building the tarball. npm
          # copies it through verbatim and reports success, producing a package
          # nobody can install.
          for pkg in $NOTIFIE_PACKAGES; do
            (cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/staging")
          done
          ls -1 staging

      - name: Verify packed manifests
        run: |
          set -euo pipefail
          for tarball in staging/*.tgz; do
            manifest="$(tar -xzOf "$tarball" package/package.json)"
            if printf '%s' "$manifest" | grep -q '"workspace:'; then
              echo "::error::$tarball declares an unresolved workspace range"
              printf '%s' "$manifest" | grep '"workspace:'
              exit 1
            fi
            repository="$(printf '%s' "$manifest" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(input).repository;
                console.log(typeof value === "string" ? value : value?.url ?? "");
              });
            ')"
            case "$repository" in
              *github.com/rohit1521/notifie*) ;;
              *)
                echo "::error::$tarball has invalid repository metadata: $repository"
                exit 1
                ;;
            esac
          done
          echo "Packed manifests have resolved dependencies and valid repository metadata."

      # Packages are uploaded in dependency order so there is never a window in
      # which @notifie-dev/cli is installable but @notifie-dev/contracts is not.
      #
      # The ./ prefix is required. npm parses a bare "staging/name.tgz" as the
      # GitHub owner/repo shorthand and tries to clone it over SSH rather than
      # reading the file, which fails with an unrelated git permissions error.
      - name: Publish
        if: ${{ inputs.verify_only == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in $NOTIFIE_PACKAGES; do
            package_name="$(node -p "require('./$pkg/package.json').name")"
            name="$(printf '%s' "$package_name" | tr -d '@' | tr '/' '-')"
            version="$(node -p "require('./$pkg/package.json').version")"
            tarball="./staging/$name-$version.tgz"

            if npm view "$package_name@$version" version \
              --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "Skipping existing immutable version $package_name@$version"
              continue
            fi

            args="--tag ${{ inputs.tag }} --access public --provenance --registry https://registry.npmjs.org/"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              args="$args --dry-run"
            fi

            echo "Publishing $tarball"
            npm publish "$tarball" $args
          done

      - name: Deprecate broken CLI beta.1
        if: ${{ inputs.dry_run == false && inputs.verify_only == false && inputs.target == 'cli' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate @notifie-dev/cli@0.1.0-beta.1 \
            "Broken executable entrypoint; use 0.1.0-beta.2 or newer." \
            --registry https://registry.npmjs.org/

      # npm creates `latest` on first publish and offers no way to delete it, so
      # it still points at the withdrawn 0.1.0-beta.1: a plain
      # `npm install -g @notifie-dev/cli` installs a CLI that fails on startup.
      #
      # Moving it is guarded rather than automatic. Once a stable version
      # exists, pointing `latest` at a prerelease would downgrade every plain
      # install — which is what the "refuse a prerelease under latest" check
      # above prevents at publish time. So this only runs while every published
      # version is a prerelease, where the choice is between a working
      # prerelease and a broken one.
      - name: Point latest at the newest working prerelease
        if: ${{ inputs.dry_run == false && inputs.verify_only == false && inputs.target == 'cli' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          stable="$(npm view @notifie-dev/cli versions --json \
            --registry https://registry.npmjs.org/ \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                const all = JSON.parse(d);
                const list = Array.isArray(all) ? all : [all];
                console.log(list.filter((v) => !v.includes("-")).length);
              })')"

          if [ "$stable" != "0" ]; then
            echo "A stable release exists; leaving the latest tag untouched."
            exit 0
          fi

          echo "Pointing latest at $version"
          npm dist-tag add "@notifie-dev/cli@$version" latest \
            --registry https://registry.npmjs.org/

      - name: Verify published CLI
        if: ${{ inputs.dry_run == false && inputs.target == 'cli' }}
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if version="$(npm view @notifie-dev/cli@beta version \
              --registry https://registry.npmjs.org/ 2>&1)"; then
              echo "Registry version: $version"
            else
              echo "npm view failed: $version"
              echo "Waiting for npm propagation ($attempt/20)..."
              sleep 15
              continue
            fi

            if output="$(npm exec --yes --package=@notifie-dev/cli@beta \
              -- notifie --help 2>&1)"; then
              printf '%s\n' "$output"
            else
              echo "npm exec failed: $output"
              echo "Waiting for npm propagation ($attempt/20)..."
              sleep 15
              continue
            fi

            if printf '%s\n' "$output" | grep -q 'Notifie CLI'; then
              echo "Verified @notifie-dev/cli@$version"
              exit 0
            fi
            echo "CLI output did not contain the expected heading."
            echo "Waiting for npm propagation ($attempt/20)..."
            sleep 15
          done
          echo "::error::Published CLI did not become installable within five minutes"
          exit 1
