name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A version published to Maven Central, pub.dev, CocoaPods or npm can never be
  # replaced, so shipping code that changes without a version bump cannot reach a
  # user no matter how cleanly it merges. Nothing else in this pipeline notices:
  # the diff looks complete and every test passes.
  release-guard:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard compares against the base branch, which a shallow clone
          # does not contain.
          fetch-depth: 0
      - name: Shipping code requires a version bump
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-version-bump') }}
        run: .github/scripts/check-version-bumps.sh "origin/${{ github.base_ref }}"

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No dependency cache: caching keys on a lockfile, and this repository
      # deliberately does not commit one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  swift:
    name: Swift SDK
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swift build
        working-directory: sdks/swift
      - run: xcrun swift test
        working-directory: sdks/swift

      # The two steps above target the host, which is macOS. Every
      # `#if canImport(UIKit)` path -- the lifecycle observers, APNs enrolment
      # and device context -- is therefore compiled out, so nothing so far
      # would notice if the iOS half of an iOS SDK stopped compiling. Only an
      # explicit iOS destination builds it.
      - name: Build for iOS
        run: |
          xcodebuild -scheme Notifie \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/notifie-ios" \
            build
        working-directory: sdks/swift

      # The pod is what consumers actually install, and its metadata can be
      # wrong -- a bad file pattern, a deployment target below an API it uses --
      # in ways no swift build reveals.
      - name: Lint the podspec
        run: pod lib lint Notifie.podspec --allow-warnings --fail-fast

  # flutter analyze and flutter test never compile the plugin's Swift half,
  # which is how a bridge that silently discarded every local notification tap
  # on iOS reached a release. Building the example is what compiles it.
  # The only job that installs what a developer installs.
  #
  # Every other job builds the checked-out tree, which is how notifie_flutter
  # 0.1.0-beta.7 shipped pinning notifie-android 0.1.0-beta.4 — three fixed
  # defects still live for anyone who ran `flutter pub add`, while the whole
  # pipeline was green. Nothing compared the published plugin against the
  # artifact it claims to bundle.
  #
  # No mavenLocal, no path dependency, no project substitution: the app is
  # created from scratch and resolves only pub.dev and Maven Central.
  registry-smoke:
    name: Registry smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build a throwaway app from published packages only
        run: |
          set -euo pipefail
          flutter_version="$(sed -n 's/^version: *//p' sdks/flutter/pubspec.yaml)"
          echo "This repository advertises notifie_flutter $flutter_version"

          flutter create --platforms=android "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          # Exact version, not a caret range: the point is to prove the version
          # this repository tells people to install is the one that works.
          flutter pub add "notifie_flutter:$flutter_version"
          flutter build apk --debug

      - name: The published plugin must bundle the published native SDK
        run: |
          set -euo pipefail
          want="$(grep -o 'notifieVersion = "[^"]*"' \
            sdks/android/notifie/build.gradle.kts | cut -d'"' -f2)"
          resolved="$(cd "$RUNNER_TEMP/consumer/android" \
            && ./gradlew :app:dependencies --configuration debugRuntimeClasspath \
            | grep -o 'dev\.notifie:notifie-android:[0-9A-Za-z.-]*' \
            | head -1 | cut -d: -f3)"

          echo "resolved from Maven Central: ${resolved:-<none>}"
          echo "advertised by this repo    : $want"
          if [ -z "$resolved" ]; then
            echo "::error::The published plugin pulled in no notifie-android at all."
            exit 1
          fi
          if [ "$resolved" != "$want" ]; then
            echo "::error::Installing notifie_flutter gives notifie-android $resolved, but this repository advertises $want. Publish a plugin release that pins $want."
            exit 1
          fi

      - name: Exactly one activity may handle a notification tap
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          found=0
          for manifest in $(find build/app/intermediates -path '*merged_manifest*' -name AndroidManifest.xml); do
            found=1
            count=$(grep -c 'android:name="dev.notifie.NOTIFICATION_OPEN"' "$manifest" || true)
            echo "$count handler(s) in $manifest"
            if [ "$count" != "1" ]; then
              echo "::error::$manifest declares $count handlers; exactly 1 is required."
              exit 1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::No merged manifest found. The check cannot pass vacuously."
            exit 1
          fi

  flutter-ios:
    name: Flutter SDK (iOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the example app for iOS
        run: flutter build ios --no-codesign --debug
        working-directory: examples/flutter

  flutter:
    name: Flutter SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter analyze
        working-directory: sdks/flutter
      - run: flutter test
        working-directory: sdks/flutter

      # analyze and test never merge a manifest, so neither could see the
      # defect that mattered most: this plugin and the Android SDK each declared
      # an activity for the notification-open action, Android could not choose
      # between them, and it asked the user to "Complete action using" one of two
      # identical copies of their own app on every tap -- then crashed if they
      # picked the native one. That only exists once Gradle merges two published
      # artifacts, which is a layer no unit test reaches.
      - name: Build the example app
        run: flutter build apk --debug
        working-directory: examples/flutter
      - name: Exactly one activity may handle a notification tap
        working-directory: examples/flutter
        run: |
          found=0
          for manifest in $(find build/app/intermediates -path '*merged_manifest*' -name AndroidManifest.xml); do
            found=1
            count=$(grep -c 'android:name="dev.notifie.NOTIFICATION_OPEN"' "$manifest" || true)
            echo "$count handler(s) in $manifest"
            if [ "$count" != "1" ]; then
              echo "::error::$manifest declares $count handlers for dev.notifie.NOTIFICATION_OPEN; exactly 1 is required."
              exit 1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::No merged manifest found. The check cannot pass vacuously."
            exit 1
          fi

      # `flutter test` reaches only the Dart half of this plugin. The Android
      # bridge -- the method channel and the activity that turns a notification
      # tap into a Dart route -- had no test at all, which is how a tap that
      # silently did nothing reached a published release. These run in the
      # example app's build because that is where the Flutter engine artifacts
      # the plugin compiles against are resolvable.
      - name: Android bridge unit tests
        run: ./gradlew :notifie_flutter:testDebugUnitTest
        working-directory: examples/flutter/android

  # The Android SDK owns notification display, tap handling and token
  # registration. Its unit tests were previously run only by hand, which is how
  # a remote push whose tap did nothing reached a release.
  android:
    name: Android SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :notifie:testDebugUnitTest
        working-directory: sdks/android

  secrets:
    name: Credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # This repository must never contain provider credentials. Three files are
      # allowed, each by exact path so a real credential beside them is still
      # rejected: the stock React Native debug keystore, which is public, signs
      # debug builds only and is byte-identical in every RN project; and the two
      # example google-services.json files, which are client configuration for a
      # Firebase project created solely to be public. They ship inside every APK
      # and cannot send a notification -- that needs the service account, which
      # is not here. Without them no example can receive a push, which is the
      # gap every Android defect this project shipped went through.
      - name: Reject credential files
        run: |
          found=$(git ls-files \
            '*.p8' '*.p12' '*.mobileprovision' '*.keystore' '*.jks' \
            '**/google-services.json' '**/GoogleService-Info.plist' \
            '**/*service-account*.json' '.env' \
            | grep -vx 'examples/react-native/android/app/debug.keystore' \
            | grep -vx 'examples/android/app/google-services.json' \
            | grep -vx 'examples/flutter/android/app/google-services.json' || true)
          if [ -n "$found" ]; then
            echo "Credential files must not be committed:"
            echo "$found"
            exit 1
          fi
          echo "No credential files found."

      # Notifie Cloud is proprietary. A reference here means private source or
      # server-only configuration reached this repository.
      - name: Reject Cloud references
        run: |
          found=$(git grep -lE '@notifie/cloud-|SUPABASE_SERVICE_ROLE_KEY|PUSH_CREDENTIALS_ENCRYPTION_KEY' \
            -- ':!.github/workflows/ci.yml' || true)
          if [ -n "$found" ]; then
            echo "Notifie Cloud references must not appear in the public repository:"
            echo "$found"
            exit 1
          fi
          echo "No Cloud references found."
