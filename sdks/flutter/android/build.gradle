group = "dev.notifie.flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        // Kept on the classpath but deliberately not applied below. On AGP 8
        // the Flutter Gradle Plugin applies kotlin-android to this project
        // itself when the plugin does not, so the Kotlin sources still compile
        // for consumers who have not moved to built-in Kotlin.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}

apply plugin: "com.android.library"

// `apply plugin: "org.jetbrains.kotlin.android"` used to follow. Applying KGP
// from a plugin is what Flutter now warns about — "future versions of Flutter
// will fail to build if your app uses plugins that apply KGP" — because AGP 9
// provides Kotlin itself and a second application conflicts with it.

// Set through the Kotlin extension rather than `android { kotlinOptions }`,
// which is tied to the plugin this project no longer applies.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

android {
    namespace = "dev.notifie.flutter"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }


    testOptions {
        // Robolectric needs the merged resources and manifest to stand up a
        // context; without this the bridge cannot be exercised at all.
        unitTests.includeAndroidResources = true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // The bridge delegates to this artifact rather than scheduling itself, so
    // persistence, reboot recovery and drift-free recurrence keep a single
    // implementation. Source inclusion cannot work here: Android resource
    // classes resolve against the compiling module's namespace.
    implementation "dev.notifie:notifie-android:0.1.0-beta.5"

    // The bridge is the seam between Dart and the native SDK, and a mismatch
    // there fails only on a device: the notification-tap regression reached a
    // release precisely because nothing here was executed by a test.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "org.mockito:mockito-core:5.14.2"
}
